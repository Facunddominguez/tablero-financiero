name: Datos de mercado

on:
  schedule:
    # Lunes a viernes 11:30, 14:30 y 17:30 de Argentina (UTC-3)
    - cron: "30 14,17,20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercado
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install --quiet yfinance
      - name: Bajar datos
        run: python tools/mercado.py
        env:
          ALERTAS_CONFIG: ${{ secrets.ALERTAS_CONFIG }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Guardar si cambió algo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/insiders.json data/historico.json data/alertas_estado.json 2>/dev/null || git add data/market.json data/insiders.json data/historico.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "datos: mercado $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
