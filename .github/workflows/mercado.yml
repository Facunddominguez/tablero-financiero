name: Datos de mercado

on:
  schedule:
    # Respaldo: lunes a viernes ~11:40, 14:40 y 17:40 de Argentina (UTC-3). La primera va después de la apertura de
    # Wall Street (11:30 en invierno de EE.UU.): sin eso no hay precio justo. GitHub las atrasa o saltea a veces;
    # el horario confiable lo da un cron externo (cron-job.org) que llama a workflow_dispatch con origen "cron".
    - cron: "40 14,17,20 * * 1-5"
  workflow_dispatch:
    inputs:
      origen:
        description: "Quién la pide: app (solo precios) o manual (corre todo) / cron (se saltea si hay datos de hace menos de 40 min)"
        required: false
        default: manual
        type: string

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: mercado
      cancel-in-progress: false
    outputs:
      correr: ${{ steps.chequeo.outputs.correr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # lo último de la rama, no el commit con el que se encoló la corrida
      # Si llegan la programada de GitHub y la del cron externo, la segunda no repite el trabajo.
      - name: ¿Hace falta?
        id: chequeo
        env:
          ORIGEN: ${{ github.event_name == 'schedule' && 'schedule' || inputs.origen || 'manual' }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          origen = os.environ["ORIGEN"]
          correr = True
          if origen in ("schedule", "cron"):
              try:
                  g = json.load(open("data/market.json"))["generado"]
                  edad = (datetime.now(timezone.utc) - datetime.fromisoformat(g.replace("Z", "+00:00"))).total_seconds() / 60
                  correr = edad >= 40
                  print(f"origen={origen}, datos de hace {edad:.0f} min")
              except Exception as e:
                  print("no pude leer la fecha de los datos:", e)
          print("corre" if correr else "se saltea: hay datos recientes")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"correr={'true' if correr else 'false'}\n")
          PY
      - uses: actions/setup-python@v5
        if: steps.chequeo.outputs.correr == 'true'
        with:
          python-version: "3.12"
      - name: Dependencias
        if: steps.chequeo.outputs.correr == 'true'
        run: |
          pip install --quiet -r tools/requirements.txt
          pip show yfinance | grep -i '^version'
      - name: Bajar datos
        if: steps.chequeo.outputs.correr == 'true'
        run: python tools/mercado.py
        env:
          ALERTAS_CONFIG: ${{ secrets.ALERTAS_CONFIG }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - uses: actions/setup-node@v4
        if: steps.chequeo.outputs.correr == 'true'
        with:
          node-version: "22"
      # Color del semáforo y lectura del clima del día, para el resumen del sábado. Si falla, no frena el resto.
      - name: Estado del día
        if: steps.chequeo.outputs.correr == 'true'
        continue-on-error: true
        run: node tools/estado_dia.mjs
      - name: Guardar si cambió algo
        if: steps.chequeo.outputs.correr == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # solo lo que escribe este Action (nunca el archivo cifrado ni la lista de la app); lo que no existe se saltea
          for f in market insiders historico alertas_estado alertas_semana feriados_ar argentina clima largo_plazo semaforo; do
            if [ -f "data/$f.json" ]; then git add "data/$f.json"; fi
          done
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "datos: mercado $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi

  # Calendario, noticias, clasificación y directivos. Va aparte para que un "Actualizar ahora" desde la app (que no
  # corre esto) no quede esperando detrás de una corrida larga.
  senales:
    needs: actualizar
    if: needs.actualizar.outputs.correr == 'true' && (github.event_name == 'schedule' || inputs.origen != 'app')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: senales
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install --quiet -r tools/requirements.txt
      - name: Noticias, calendario y directivos
        run: python tools/senales.py
        env:
          # Si falta alguno de estos, esa parte se saltea con un aviso.
          SEC_CONTACTO: ${{ secrets.SEC_CONTACTO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Guardar si cambió algo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in sec_cik agenda noticias ia_uso directivos; do
            if [ -f "data/$f.json" ]; then git add "data/$f.json"; fi
          done
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "datos: noticias y señales $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
